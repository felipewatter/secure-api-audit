name: Temporary lockfile bootstrap (remove before merge)
on:
  push:
    branches: [maintenance/lockfile-repro-20261107]
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'felipewatter/secure-api-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Generate genuine npm lockfile and validate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then echo 'Already exists'; exit 0; fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm audit --audit-level=high
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: lock verified npm dependency tree'
          git push origin HEAD:maintenance/lockfile-repro-20261107

name: Package consumer compatibility (no publish)
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/consumer-compat.yml'
      - '.github/scripts/package-consumer-smoke.cjs'
permissions:
  contents: read
jobs:
  consumer:
    name: Consumer / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.0.0', '22.12.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build candidate with supported development Node
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Verify package consumer without executing CLI, publish or deploy
        run: node .github/scripts/package-consumer-smoke.cjs

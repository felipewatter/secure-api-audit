name: Publish Secure API Audit v1.1.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.1.0.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'felipewatter/secure-api-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for release notes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Confirm validated release commit
        env:
          RELEASE_COMMIT: 184f30b5d83cb277809db5608270c5b7207cec10
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          test -f .github/release-notes/v1.1.0.md

      - name: Create official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: 184f30b5d83cb277809db5608270c5b7207cec10
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.1.0 already exists; not replacing existing release"
            exit 0
          fi
          gh release create v1.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" \
            --title "Secure API Audit v1.1.0 — Security Hardening & Reliability" \
            --notes-file .github/release-notes/v1.1.0.md \
            --latest
